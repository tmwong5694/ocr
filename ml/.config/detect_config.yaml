# Vision-Language OCR Detection Configuration
ocr_model:
  # Model configuration - supports any HuggingFace vision-language model [deepseek-ai/DeepSeek-OCR-2/zai-org/GLM-OCR]
  model_name: "zai-org/GLM-OCR"
  # Device configuration: cpu, cuda, mps (Apple Silicon), auto (auto-detect if not specified)
  device: "auto"
  # Generation parameters
  max_tokens: 8192
  # Path to file for inference
  file_path: "ml/samples/pdfs/gp_2025.10.20.pdf"

  preprocess:
    enabled: true
    max_width: 768
    max_height: 768
    quality: 85