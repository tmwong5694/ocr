# Vision-Language OCR Detection Configuration
ocr_model:
  # Model configuration - supports any HuggingFace vision-language model
  model_name: "zai-org/GLM-OCR"
  
  # Device configuration (auto-detect if not specified)
  # Options: cpu, cuda, mps (Apple Silicon), auto
  device: "mps"

  # Generation parameters
  max_tokens: 8192

  # Default inference parameters
  prompt: "Text Recognition:"
  
  # Default test image path
  default_image_path: "ml/data/prescription/Training/training_words/0.png"

