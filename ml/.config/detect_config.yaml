# Vision-Language OCR Detection Configuration
ocr_model:
  # Model configuration - supports any HuggingFace vision-language model
  model_name: "zai-org/GLM-OCR"
  # Device configuration: cpu, cuda, mps (Apple Silicon), auto (auto-detect if not specified)
  device: "mps"
  # Generation parameters
  max_tokens: 8192
  # Path to file for inference
#  file_path: "ml/data/prescription/Training/training_words/0.png"
#  file_path: "ml/samples/images/IMG_3290.jpg"
  file_path: "ml/samples/pdfs/gp_2025.10.20.pdf"

  preprocess:
    enabled: true
    max_width: 768
    max_height: 768
    quality: 85