[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "ml_pipeline",
    "pydantic>=2.13.3",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.49",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.46.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend_src/ocr_backend"]

[tool.uv.sources]
ml_pipeline = { workspace = true }
shared_utils = { workspace = true }

[project.scripts]
backend-api = "ocr_backend.main:app"